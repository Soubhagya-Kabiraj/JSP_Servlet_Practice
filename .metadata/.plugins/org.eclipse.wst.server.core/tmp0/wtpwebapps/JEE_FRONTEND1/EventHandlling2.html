<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Event Handling 2</title>
<script>
	function ChangetoAngular(){
		var angref=document.getElementById("dom");
		angref.src="https://th.bing.com/th/id/OIP.lt05AZsVoMnpr_x08K1luwHaHa?w=250&h=250&c=8&rs=1&qlt=90&o=6&cb=thwsc4&dpr=1.3&pid=3.1&rm=2";
	}
	function ChangetoReact(){
		var reref=document.getElementById("dom");
		reref.src="https://th.bing.com/th/id/OIP.QdIrCNdF2ZVylABjjes1LAHaGq?w=263&h=237&c=8&rs=1&qlt=90&o=6&cb=thwsc4&dpr=1.3&pid=3.1&rm=2";
	}
</script>
</head>
<body>
	<div style= text-align:center;>
		<img id="dom" src = "https://www.bing.com/th/id/OIP.DEt_TbohHcb6KhpldP6vMwHaEK?w=257&h=211&c=8&rs=1&qlt=90&o=6&cb=thwsc4&dpr=1.3&pid=3.1&rm=2"
		height = "200px"
		width = "200px"
		alt= "No Image"/>
		<br/><br/>
		<button onclick="ChangetoAngular()">ANGULAR JS</button> &nbsp; &nbsp;
		<button onclick="ChangetoReact()">REACT JS</button>
	</div>
</body>
</html>
