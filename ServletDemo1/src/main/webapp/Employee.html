<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>EMPLOYEE FORM</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
	<div style="text-align:center;margin:50px auto;width:30%;">
		<form action="EmployeeServe" method="post">
		<h3 style="color:blue;">EMPLOYEE FORM</h3>
			<input type="text" class="form-control"name="eid" placeholder="ENTER ID">
			<input type="text" class="form-control"name="ename" placeholder="ENTER NAME">
			<select type="text" class="form-control"name="dept">
				<option value="">CHOOSE DEPARTMENT</option>
				<option value="hr">HR</option>
				<option value="mktg">MARKETING</option>
				<option value="finance">FINANCE</option>
				<option value="it">IT</option>
			</select>
			<select type="text" class="form-control"name="desig">
				<option value="">CHOOSE DESIGNATION</option>
				<option value="manager">MANAGER</option>
				<option value="analyst">ANALYST</option>
				<option value="clerk">CLERK</option>
			</select>
			<input type="submit" class="btn btn-outline-primary" type="submit" value="ADD"/>
		</form>
	</div>
</body>
</html>
