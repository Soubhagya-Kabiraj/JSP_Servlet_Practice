<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>JAVASCRIPT VARIABLE</title>
<script>
	var x=10;
	document.write("X:"+x);
	document.write("<br/>");
	document.write(typeof x);
	document.write("<br/>");
	
	var per=90.9;
	document.write("PERCENTAGE:"+per);
	document.write("<br/>");
	document.write(typeof per);
	document.write("<br/>");
	
	var name="Soubhagya";
	document.write("NAME:"+name);
	document.write("<br/>");
	document.write(typeof name);
	document.write("<br/>");
	
	var isMarried=false;
	document.write("MARRIED:"+isMarried);
	document.write("<br/>");
	document.write(typeof isMarried);
	document.write("<br/>");
	
	var state=null;
	document.write("STATE:"+state);
	document.write("<br/>");
	document.write(typeof state);
	document.write("<br/>");
	
	var city;
	document.write("CITY:"+city);
	document.write("<br/>");
	document.write(typeof city);
	document.write("<br/>");
	
	var arr=[100,200,300,400];
	document.write(arr);
	document.write("<br/>");
	document.write(typeof arr);
	document.write("<br/>");
	
	var obj={
		id:1,
		nm:"SOU",
		phno:'123456'
	}
	document.write(obj.id,obj.nm,obj.phno);
	document.write("<br/>");
	document.write(typeof obj);
	document.write("<br/>");
</script>
</head>
<body>

</body>
</html>
