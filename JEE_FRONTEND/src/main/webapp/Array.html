<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ARRAY</title>
<script>
	var arr=[10,20,30,40];
	document.write(arr);
	document.write("<br/>");
	//ADD VALUE TO LAST
	arr.push(50);
	document.write(arr);
	document.write("<br/>");
	//REMOVE LAST
	arr.pop();
	document.write(arr);
	document.write("<br/>");
	//ADD VALUE IN FIRST
	arr.unshift(90);
	document.write(arr);
	document.write("<br/>");
	//REMOVE FIRST
	arr.shift();
	document.write(arr);
	document.write("<br/>");
	//DELETE FROM SPECIFIC POSITION
	arr.splice(2,1);
	document.write(arr);
	document.write("<br/>");
	//ADD VALUE IN SPECIFIC POSITION
	arr.splice(2,0,50);
	document.write(arr);
	document.write("<br/>");
</script>
</head>
<body>

</body>
</html>
