<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MARGIN PADDING BORDER</title>
<style>
	#parent{
		border:10px solid red;
	}
	
	#child1{
		border:10px solid black;
		margin:30px 5px 15px 20px;
		padding:2px 5px 10px 15px;
		margin:10px all;
	}
	
	#child2{
		border:10px solid yellow;
		margin:10px 5px;
		padding:2px 5px 10px 15px;
	}
</style>
</head>
<body>
	<div ID="parent">
		<h2>PARENT</h2>
		<div id="child1">
			<h2>CHILD1 </h2>
		</div>
		<div id="child2">
			<h2>CHILD2</h2>
		</div>
	</div>
</body>
</html>
